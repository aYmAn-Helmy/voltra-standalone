plugins { id 'com.android.application' }

android {
    namespace 'com.powera.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.powera.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
