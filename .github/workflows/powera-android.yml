name: Build PowerA Android APK
on:
  push:
    branches: [PowerA]
    paths:
      - 'powera/android/**'
      - 'powera/hub.py'
      - 'powera/web/**'
      - 'test/test_powera_hub.py'
      - 'test/test_powera_scheduler.py'
      - 'test/powera-web.test.mjs'
      - 'powera/scheduler.py'
      - 'powera/stock_bridge.py'
      - 'powera/standalone_sync.py'
      - 'powera/energy_history.py'
      - 'test/test_powera_v04.py'
      - 'test/powera-v04-ui.test.mjs'
      - 'powera/web/device-settings.js'
      - 'powera/web/energy.js'
      - 'test/test_powera_stock.py'
      - '.github/workflows/powera-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web UI test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test unified app web UX
        run: node --test test/powera-web.test.mjs test/powera-v04-ui.test.mjs
      - name: Verify PowerA Hub code and web frontend
        run: |
          python3 -m py_compile powera/hub.py powera/scheduler.py powera/stock_bridge.py powera/standalone_sync.py powera/energy_history.py
          node --check powera/web/app.js
          node --check powera/web/device-settings.js
          node --check powera/web/energy.js
          python3 -m unittest discover -s test -p 'test_powera_*.py' -v
      - name: Install Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build original PowerA Android app
        run: gradle -p powera/android :app:assembleDebug --no-daemon --stacktrace
      - name: Inspect APK
        run: |
          apk=powera/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx classes.dex
          mkdir -p powera/dist
          cp "$apk" powera/dist/PowerA-v0.4.0-preview.apk
          ls -lh powera/dist/PowerA-v0.4.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PowerA-Android-v0.4.0
          path: powera/dist/PowerA-v0.4.0-preview.apk
          retention-days: 90
      - name: Upload PowerA source and QA reference
        uses: actions/upload-artifact@v4
        with:
          name: PowerA-v0.4.0-Hub-and-Web
          path: |
            powera/*.py
            powera/config.example.json
            powera/web/**
            test/test_powera_*.py
            test/powera-*.mjs
          retention-days: 30
      - name: Publish PowerA preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=powera-preview-v0.4.0
          apk=powera/dist/PowerA-v0.4.0-preview.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
              --title 'PowerA Android 0.4.0 Preview' \
              --notes 'PowerA v0.4: one-tap full outlet cards; two-way Standalone v7 device-owned schedule, protection, timer, name sync with verified readback; per-outlet 7/30/90-day metered energy and gap tracking; native Stock TCP 10086. No login or tokens; LAN only; restart updated Python Hub on same Wi-Fi, Android app is only a dashboard. Hardware verification pending; unsupported firmware Power Recovery remains unavailable. See README on PowerA branch.'
          fi
          gh release upload "$tag" "$apk" --clobber
