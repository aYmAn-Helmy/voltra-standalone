name: Build PowerA Android APK
on:
  push:
    branches: [PowerA]
    paths:
      - 'powera/android/**'
      - 'powera/hub.py'
      - 'powera/web/**'
      - 'test/test_powera_hub.py'
      - 'test/test_powera_scheduler.py'
      - 'test/powera-web.test.mjs'
      - 'powera/scheduler.py'
      - 'powera/stock_bridge.py'
      - 'test/test_powera_stock.py'
      - '.github/workflows/powera-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web UI test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test unified app web UX
        run: node --test test/powera-web.test.mjs
      - name: Verify PowerA Hub code and web frontend
        run: |
          python3 -m py_compile powera/hub.py powera/scheduler.py powera/stock_bridge.py
          node --check powera/web/app.js
          python3 -m unittest discover -s test -p 'test_powera_*.py' -v
      - name: Install Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build original PowerA Android app
        run: gradle -p powera/android :app:assembleDebug --no-daemon --stacktrace
      - name: Inspect APK
        run: |
          apk=powera/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx classes.dex
          mkdir -p powera/dist
          cp "$apk" powera/dist/PowerA-v0.3.0-preview.apk
          ls -lh powera/dist/PowerA-v0.3.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PowerA-Android-v0.3.0
          path: powera/dist/PowerA-v0.3.0-preview.apk
          retention-days: 90
      - name: Publish PowerA preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=powera-preview-v0.3.0
          apk=powera/dist/PowerA-v0.3.0-preview.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
              --title 'PowerA Android 0.3.0 Preview' \
              --notes 'Original Android app with local Wi-Fi Hub discovery and integrated Stock/Standalone dashboard, without accounts or tokens. Requires separately running PowerA Hub and stock powerk controller for stock strips. Local trusted LAN ONLY; unsafe on guest/public Wi-Fi. Debug-signed preview; physical hardware verification pending.'
          fi
          gh release upload "$tag" "$apk" --clobber
