name: Voltra CI
on:
  push:
    branches: [main, feat/central-dashboard]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/manager.mjs
          node --check src/server.mjs
          node --check src/index.mjs
          node --check public/app.js
      - name: Run tests
        run: npm test
