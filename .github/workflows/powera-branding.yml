name: Verify PowerA Android branding
on:
  push:
    branches: [PowerA]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test rename overlay
        run: python3 -m unittest discover -s test -p 'test_branding.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web UI test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Android and web UX
        run: node --test test/powera-web.test.mjs
      - name: Check Hub and web syntax
        run: |
          python3 -m py_compile powera/hub.py powera/scheduler.py powera/stock_bridge.py
          node --check powera/web/app.js
      - name: Run multi-firmware control and API tests
        run: python3 -m unittest discover -s test -p 'test_powera_*.py' -v
      - name: Apply PowerA name and check Android settings
        run: |
          python3 scripts/brand_powera.py
          python3 scripts/brand_powera.py --check
          grep -F '<string name="app_name">PowerA</string>' upstream/powerk/android/app/src/main/res/values/strings.xml
          grep -F '<string name="app_name">PowerA</string>' upstream/powerk/android/app/src/main/res/values-ar/strings.xml
          grep -F 'applicationId = "com.powera.app"' upstream/powerk/android/app/build.gradle.kts
