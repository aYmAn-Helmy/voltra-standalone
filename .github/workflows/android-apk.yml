name: Build Voltra Android APK
on:
  push:
    branches: [feat/android-apk-autodiscovery]
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transport and professional Android UI
        run: |
          node --check public/mobile.js
          node --check public/pro-ui.js
          node --test test/mobile.test.mjs
          npm install --no-save --ignore-scripts jsdom@24.1.3
          node --test test/pro-ui.test.mjs
      - name: Use hosted Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK contains the full offline UI
        run: |
          file=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$file"
          for asset in index.html app.js settings.js live.js mobile.js pro-ui.js style.css pro-ui.css; do
            unzip -Z1 "$file" | grep -Fx "assets/$asset"
          done
          unzip -Z1 "$file" | grep -Fx classes.dex
          cp "$file" android/app/build/outputs/apk/debug/Voltra-Standalone.apk
          ls -lh android/app/build/outputs/apk/debug/Voltra-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Voltra-Standalone-Android-APK
          path: android/app/build/outputs/apk/debug/Voltra-Standalone.apk
          retention-days: 90
      - name: Attach APK to GitHub preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=android-preview-v0.2.0
          path=android/app/build/outputs/apk/debug/Voltra-Standalone.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title 'Voltra Pro Android v0.2.0 (Preview)' \
              --notes 'Professional Android UI: four-tab bottom navigation, smart onboarding/discovery, live SSE device cards, favorites, light/dark theme and existing full standalone controls. LAN only; physical hardware validation outstanding. Debug signing is temporary.' \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$path" --clobber
          gh release delete-asset "$tag" app-debug.apk --yes || true
