plugins {
    id 'com.android.application'
}
android {
    namespace 'com.voltra.standalone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.voltra.standalone'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../public']
        }
    }
}
